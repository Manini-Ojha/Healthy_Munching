# Generated for manual reference — `fly launch` will offer to create/overwrite this.
# Replace `app` with the name you choose during `fly launch`.
app = "healthy-munching"
primary_region = "bom"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/data.sqlite"

[[mounts]]
  source = "healthy_munching_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
